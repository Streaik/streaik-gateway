name: Gateway CI and Azure deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          path: streaik-gateway

      # Streaik project references expect these as siblings of streaik-gateway.
      - name: Checkout providers
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-providers
          path: streaik-providers
      - name: Checkout Vercel
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-vercel
          path: streaik-vercel
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-catalog
          path: streaik-catalog
      - name: Checkout OpenAI
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-openai
          path: streaik-openai
      - name: Checkout Chat Completions
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-chat-completions
          path: streaik-chat-completions
      - name: Checkout Responses
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-responses
          path: streaik-responses
      - name: Checkout Messages
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-messages
          path: streaik-messages
      - name: Checkout Interactions
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-interactions
          path: streaik-interactions

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Test gateway
        working-directory: streaik-gateway
        run: dotnet test tests/Streaik.Gateway.Tests/Streaik.Gateway.Tests.csproj -c Release

      - name: Publish gateway sample
        working-directory: streaik-gateway
        run: |
          dotnet publish samples/Streaik.Gateway.Sample/Streaik.Gateway.Sample.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o artifacts/publish

      - name: Upload gateway package
        uses: actions/upload-artifact@v4
        with:
          name: streaik-gateway-win-x64
          path: streaik-gateway/artifacts/publish/
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-test-publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download gateway package
        uses: actions/download-artifact@v4
        with:
          name: streaik-gateway-win-x64
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # azure/webapps-deploy supports Windows App Service packages as well.
      - name: Deploy Azure Windows App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
